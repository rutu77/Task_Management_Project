<section class="auth-shell">
  <div class="auth-card">
    <div class="auth-header">
      <span class="eyebrow">Start here</span>
      <h2>Create account</h2>
    </div>

    <form #form="ngForm" (ngSubmit)="register()" novalidate>
      <label class="field">
        <span>Username</span>
        <input type="text" placeholder="Choose a username" [(ngModel)]="username" name="username" required />
      </label>

      <label class="field">
        <span>Password</span>
        <input type="password" placeholder="Choose a password" [(ngModel)]="password" name="password" required />
      </label>

      <label class="field">
        <span>Role</span>
        <select [(ngModel)]="role" name="role" required>
          <option value="user">User</option>
          <option value="admin">Admin</option>
        </select>
      </label>

      <div *ngIf="errorMsg" class="error-message">{{ errorMsg }}</div>

      <button class="primary-btn" type="submit" [disabled]="form.invalid">Register</button>
    </form>

    <p class="switch-link">Already registered? <a routerLink="/auth/login">Login here</a></p>
  </div>
</section>
