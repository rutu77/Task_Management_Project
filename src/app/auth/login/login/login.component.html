<section class="auth-shell">
  <div class="auth-card">
    <div class="auth-header">
      <span class="eyebrow">Welcome back</span>
      <h2>Login to TaskFlow</h2>
    </div>

    <form #form="ngForm" (ngSubmit)="login()" novalidate>
      <label class="field">
        <span>Username</span>
        <input type="text" placeholder="Enter username" [(ngModel)]="username" name="username" required />
      </label>

      <label class="field">
        <span>Password</span>
        <input type="password" placeholder="Enter password" [(ngModel)]="password" name="password" required />
      </label>

      <div *ngIf="errorMsg" class="error-message">{{ errorMsg }}</div>

      <button class="primary-btn" type="submit" [disabled]="form.invalid">Login</button>
    </form>

    <p class="switch-link">Need an account? <a routerLink="/auth/register">Create one</a></p>
  </div>
</section>
